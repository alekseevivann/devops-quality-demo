name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Линтер
        run: flake8 app tests
      - name: Модульные тесты и порог покрытия
        run: >
          pytest --junitxml=report.xml
          --cov=app --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.python-version }}
          path: |
            report.xml
            coverage.xml

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit && bandit -r app -ll

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: [test, security]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy.sh staging ${{ github.sha }}

  deploy-production:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    # В настройках репозитория для окружения production
    # задаются обязательные рецензенты (ручное подтверждение)
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy.sh production ${{ github.sha }}
